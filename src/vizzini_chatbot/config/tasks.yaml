gather_customer_preferences:
  description: >
    Conduct a natural, warm conversation with the customer to gather their complete coffee preferences.
    Start with a friendly greeting s.a "hello, I am here to help you pick your coffee"
    "What are your preferences?"
  expected_output: >
    Customer Preferences Summary:
    Taste Profile: [Bitter/Acidic/Balanced],
    Roast Level: [Light/Medium/Strong]
  agent: customer_service_agent

