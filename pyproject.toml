[project]
name = "vizzini_chatbot"
version = "0.1.0"
description = "vizzini_chatbot using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.7.2",
    "langsmith",
    "openinference-instrumentation-crewai",
    "openinference-instrumentation-openai",
]

[project.scripts]
vizzini_chatbot = "vizzini_chatbot.main:run"
run_crew = "vizzini_chatbot.main:run"
train = "vizzini_chatbot.main:train"
replay = "vizzini_chatbot.main:replay"
test = "vizzini_chatbot.main:test"
run_with_trigger = "vizzini_chatbot.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
